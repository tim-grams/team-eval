envs:
  - TicTacToeTeam-v0-train
  - ConnectFourTeam-v0-train
  - BreakthroughTeam-v0-small-train
games: 24
concurrency: 200
dry_run: false
openrouter_api_key: ${OPENROUTER_API_KEY}
error_allowance: 3

temperature: 0.7
top_p: 0.95
timeout: 540.0

actors:
  GPT-OSS-Actor:
    model: openai/gpt-oss-20b
    num_gpus: 1
    max_model_len: 30000
    max_num_seqs: 120
    max_tokens: 25000
    gpu_memory_utilization: 0.95
    temperature: 0.7
    top_p: 0.95
    top_k: 50
  QWEN-3.5-Actor:
    model: Qwen/Qwen3.5-27B
    num_gpus: 1
    max_model_len: 30000
    max_num_seqs: 100
    max_tokens: 25000
    gpu_memory_utilization: 0.95
    temperature: 0.7
    top_p: 0.95
    top_k: 50

team_sampler:
  sample: 'bradley_terry'
  teams:
    GPT-OSS-Reflection:
      type: reflection
      rounds: 3
      agents:
        Robert: 
          model: openai/gpt-oss-20b
          backend: vllm
          template: hf
